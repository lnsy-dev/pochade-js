<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--  Essential META Tags -->
  <meta property="og:title" content="${project_title}">
  <meta property="og:type" content="article" />
  <meta property="og:image" content="${project_image_url}">
  <meta property="og:url" content="${project_url}">
  <meta name="twitter:card" content="summary_large_image">

  <!--  Non-Essential, But Recommended -->
  <meta property="og:description" content="${project_description}">
  <meta property="og:site_name" content="${project_sitename}">
  <meta name="twitter:image:alt" content="${project_alt_text}">

  <title>${project_title}</title>

</head>

<body>
  <h1>${project_title}</h1>
  <p>${project_description}</p>

  <!-- ========================================================================= -->
  <!-- Core Examples                                                             -->
  <!-- ========================================================================= -->

  <section id="core-examples">
    <h2>Core Examples</h2>

    <!--
      Example Component
      Demonstrates dataroom-js custom element basics and web worker communication.
      The component emits a "WEB-WORKER-RESPONSE" event when the worker replies.
    -->
    <example-component id="example_component"></example-component>
  </section>

  <!-- ========================================================================= -->
  <!-- Interactive Components                                                    -->
  <!-- ========================================================================= -->

  <section id="interactive-examples">
    <h2>Interactive Components</h2>

    <!-- Counter: demonstrates state management and custom events -->
    <counter-component id="counter_component"></counter-component>

    <!-- Fetch Example: demonstrates getJSON() and API integration -->
    <fetch-example-component id="fetch_component"></fetch-example-component>
  </section>

  <!-- <WASM-SECTION> -->
  <!-- ========================================================================= -->
  <!-- WebAssembly Examples                                                      -->
  <!-- ========================================================================= -->

  <section id="wasm-examples">
    <h2>WebAssembly Examples</h2>

    <!-- <WASM-CPP> -->
    <!-- C++ WebAssembly: Emscripten-compiled fibonacci calculator -->
    <wasm-cpp-component id="wasm_cpp_component"></wasm-cpp-component>
    <!-- </WASM-CPP> -->

    <!-- <WASM-RUST> -->
    <!-- Rust WebAssembly: wasm-pack compiled fibonacci calculator -->
    <wasm-rust-component id="wasm_rust_component"></wasm-rust-component>
    <!-- </WASM-RUST> -->
  </section>
  <!-- </WASM-SECTION> -->

  <script>
    /**
     * Event Listener Setup
     *
     * This script demonstrates how to listen to custom events emitted
     * by dataroom-js components using the component's .on() method.
     *
     * We wrap it in a setTimeout to ensure the custom elements have
     * been defined and connected before we attach listeners.
     * In production code, prefer using DOMContentLoaded or
     * customElements.whenDefined().
     */
    setTimeout(() => {
      // Listen for web worker responses from the example component
      if (typeof example_component !== 'undefined' && example_component.on) {
        example_component.on('WEB-WORKER-RESPONSE', (data) => {
          console.log('[Main Thread] Web Worker responded:', data);
        });
      }

      // Listen for counter changes
      if (typeof counter_component !== 'undefined' && counter_component.on) {
        counter_component.on('count-changed', (data) => {
          console.log('[Main Thread] Counter changed:', data.count);
        });
      }

      // <WASM-CPP>
      // Listen for C++ wasm computation results
      if (typeof wasm_cpp_component !== 'undefined' && wasm_cpp_component.on) {
        wasm_cpp_component.on('WASM-CPP-RESULT', (data) => {
          console.log('[Main Thread] C++ WASM result:', data);
        });
      }
      // </WASM-CPP>

      // <WASM-RUST>
      // Listen for Rust wasm computation results
      if (typeof wasm_rust_component !== 'undefined' && wasm_rust_component.on) {
        wasm_rust_component.on('WASM-RUST-RESULT', (data) => {
          console.log('[Main Thread] Rust WASM result:', data);
        });
      }
      // </WASM-RUST>
    }, 1000);
  </script>
</body>

</html>
